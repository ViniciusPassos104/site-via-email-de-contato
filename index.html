<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contato – Vinicius Ramlow</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #1B3A5C;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: white;
    border-radius: 16px;
    padding: 40px 32px;
    max-width: 400px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .avatar {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: linear-gradient(135deg, #1B3A5C, #2E86AB);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    margin: 0 auto 20px;
  }
  h1 { font-size: 20px; color: #1B3A5C; font-weight: 700; margin-bottom: 6px; }
  p  { font-size: 14px; color: #718096; margin-bottom: 28px; line-height: 1.6; }
  .btn {
    display: block;
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
    margin-bottom: 12px;
  }
  .btn-gmail { background: #EA4335; color: white; }
  .btn-gmail:hover { background: #d93025; transform: translateY(-1px); }
  .status {
    font-size: 12px;
    color: #A0AEC0;
    margin-top: 8px;
  }
  #msg {
    font-size: 13px;
    color: #2E86AB;
    margin-top: 16px;
    min-height: 20px;
    font-weight: 500;
  }
</style>
</head>
<body>
<div class="card">
  <div class="avatar">✉</div>
  <h1>Enviar e-mail para Vinicius</h1>
  <p>Clique abaixo para abrir o Gmail já com o e-mail preenchido e pronto para enviar.</p>

  <a class="btn btn-gmail" id="btnEmail" href="#">
    ✉&nbsp; Abrir no Gmail
  </a>

  <div id="msg"></div>
  <p class="status" id="status">Detectando seu dispositivo...</p>
</div>

<script>
  const TO      = "viniciusramlowcardosopassos@gmail.com";
  const SUBJECT = "Contato Profissional";
  const BODY    = "Olá Vinicius,";

  const encSubject = encodeURIComponent(SUBJECT);
  const encBody    = encodeURIComponent(BODY);

  // Link para PC (Gmail web)
  const gmailWeb = `https://mail.google.com/mail/?view=cm&to=${TO}&su=${encSubject}&body=${encBody}&tf=1`;

  // Link para celular (abre app Gmail)
  const mailtoLink = `mailto:${TO}?subject=${encSubject}&body=${encBody}`;

  function isMobile() {
    return /Android|iPhone|iPad|iPod|Opera Mini|IEMobile|WPDesktop/i.test(navigator.userAgent);
  }

  const btn    = document.getElementById("btnEmail");
  const status = document.getElementById("status");
  const msg    = document.getElementById("msg");

  if (isMobile()) {
    btn.href = mailtoLink;
    status.textContent = "📱 Celular detectado — vai abrir o app Gmail";
  } else {
    btn.href   = gmailWeb;
    btn.target = "_blank";
    status.textContent = "💻 Computador detectado — vai abrir o Gmail no navegador";
  }

  btn.addEventListener("click", function() {
    msg.textContent = "✅ Redirecionando para o Gmail...";
  });
</script>
</body>
</html>
